<div class="app" id="app">

  <!-- ══════════════ sidebar ══════════════ -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <img src="assets/img/logo.svg" alt="" width="40" height="40" class="brand-logo">
      <div class="brand-text">
        <strong data-i18n="app.name">Downloader Bot</strong>
        <span data-i18n="app.tagline">پنل گرافیکی آنلاین</span>
      </div>
      <button class="icon-btn sidebar-close" id="sidebarClose" data-i18n-title="ui.close" aria-label="بستن منو"><svg><use href="#i-close"/></svg></button>
    </div>

    <nav class="nav" id="nav" aria-label="ناوبری اصلی">
      <a class="nav-item" href="#/dashboard" data-route="dashboard"><svg><use href="#i-gauge"/></svg><span data-i18n="nav.dashboard">داشبورد</span></a>
      <a class="nav-item" href="#/queue" data-route="queue"><svg><use href="#i-queue"/></svg><span data-i18n="nav.queue">صف دانلود</span><em class="nav-badge" id="navQueueBadge" hidden>0</em></a>
      <a class="nav-item" href="#/logs" data-route="logs"><svg><use href="#i-terminal"/></svg><span data-i18n="nav.logs">کنسول لاگ</span><em class="nav-badge alt" id="navLogBadge" hidden>0</em></a>
      <a class="nav-item" href="#/telegram" data-route="telegram"><svg><use href="#i-send"/></svg><span data-i18n="nav.telegram">پل تلگرام</span></a>
      <a class="nav-item" href="#/sites" data-route="sites"><svg><use href="#i-globe"/></svg><span data-i18n="nav.sites">سایت‌های پشتیبانی</span></a>
      <a class="nav-item" href="#/settings" data-route="settings"><svg><use href="#i-sliders"/></svg><span data-i18n="nav.settings">تنظیمات</span></a>
      <a class="nav-item" href="#/help" data-route="help"><svg><use href="#i-help"/></svg><span data-i18n="nav.help">راهنما و درباره</span></a>
    </nav>

    <div class="sidebar-foot">
      <div class="engine-strip" id="engineStrip">
        <span class="engine-pill" data-engine="yt-dlp"><svg><use href="#i-video"/></svg>yt-dlp</span>
        <span class="engine-pill" data-engine="gallery-dl"><svg><use href="#i-image"/></svg>gallery-dl</span>
        <span class="engine-pill" data-engine="http"><svg><use href="#i-file"/></svg>HTTP</span>
      </div>
      <div class="side-links">
        <a href="https://github.com/devlopergit04/downloader-bot" target="_blank" rel="noopener"><svg><use href="#i-github"/></svg><span data-i18n="nav.repo">مخزن پروژه</span></a>
        <a href="https://github.com/devlopergit04/downloader-bot/releases" target="_blank" rel="noopener"><svg><use href="#i-download"/></svg><span data-i18n="nav.releases">دانلود Setup.exe</span></a>
      </div>
      <p class="version">v<span id="panelVersion">1.0.0</span> · <span id="modeLabelFooter">demo</span></p>
    </div>
  </aside>
  <div class="scrim" id="scrim" hidden></div>

  <!-- ══════════════ main ══════════════ -->
  <div class="main">
    <header class="topbar">
      <button class="icon-btn only-mobile" id="menuBtn" aria-label="منو"><svg><use href="#i-menu"/></svg></button>
      <div class="topbar-title">
        <h1 id="viewTitle">داشبورد</h1>
        <p id="viewSubtitle" class="muted"></p>
      </div>

      <div class="topbar-actions">
        <div class="seg" id="modeSwitch" role="group" aria-label="حالت اجرا">
          <button class="seg-btn is-on" data-mode="demo" data-i18n-title="mode.demo.tip">
            <svg><use href="#i-cpu"/></svg><span data-i18n="mode.demo">شبیه‌سازی</span>
          </button>
          <button class="seg-btn" data-mode="live" data-i18n-title="mode.live.tip">
            <svg><use href="#i-cloud"/></svg><span data-i18n="mode.live">اتصال زنده</span>
          </button>
        </div>

        <span class="conn" id="connChip" title="وضعیت اتصال">
          <i class="dot" id="connDot"></i><span id="connText">—</span>
        </span>

        <button class="icon-btn" id="langBtn" data-i18n-title="ui.lang"><svg><use href="#i-lang"/></svg></button>
        <button class="icon-btn" id="themeBtn" data-i18n-title="ui.theme"><svg><use href="#i-moon"/></svg></button>
        <a class="icon-btn" href="https://github.com/devlopergit04/downloader-bot" target="_blank" rel="noopener" data-i18n-title="nav.repo"><svg><use href="#i-github"/></svg></a>
      </div>
    </header>

    <main class="view" id="view" tabindex="-1"></main>

    <footer class="statusbar" id="statusbar">
      <span class="sb-msg" id="sbMessage">آماده</span>
      <span class="sb-stats">
        <span title="فعال"><svg><use href="#i-bolt"/></svg><b id="sbActive">0</b></span>
        <span title="در صف"><svg><use href="#i-clock"/></svg><b id="sbQueued">0</b></span>
        <span title="تکمیل‌شده"><svg><use href="#i-check"/></svg><b id="sbDone">0</b></span>
        <span title="سرعت کل"><svg><use href="#i-download"/></svg><b id="sbSpeed">0 KiB/s</b></span>
        <span class="sb-dir" id="sbDir" title="مسیر ذخیره‌سازی"></span>
      </span>
    </footer>
  </div>
</div>

<!-- ══════════════ overlays ══════════════ -->
<div class="drawer-root" id="drawerRoot" hidden>
  <div class="drawer-scrim" data-close-drawer></div>
  <aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle">
    <header class="drawer-head">
      <div>
        <h2 id="drawerTitle">جزئیات</h2>
        <p class="muted" id="drawerSubtitle"></p>
      </div>
      <button class="icon-btn" data-close-drawer aria-label="بستن"><svg><use href="#i-close"/></svg></button>
    </header>
    <div class="drawer-body" id="drawerBody"></div>
    <footer class="drawer-foot" id="drawerFoot"></footer>
  </aside>
</div>

<div class="modal-root" id="modalRoot" hidden>
  <div class="modal-scrim" data-close-modal></div>
  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <header class="modal-head"><h2 id="modalTitle"></h2><button class="icon-btn" data-close-modal><svg><use href="#i-close"/></svg></button></header>
    <div class="modal-body" id="modalBody"></div>
    <footer class="modal-foot" id="modalFoot"></footer>
  </div>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>

<div class="boot" id="boot">
  <img src="assets/img/logo.svg" alt="" width="72" height="72">
  <div class="boot-bar"><i></i></div>
  <p data-i18n="boot.loading">در حال آماده‌سازی پنل…</p>
</div>

<noscript>
  <div class="noscript">
    <h2>JavaScript لازم است</h2>
    <p>این پنل گرافیکی یک اپلیکیشن تک‌صفحه‌ای است و برای اجرا به JavaScript نیاز دارد.</p>
  </div>
</noscript>
